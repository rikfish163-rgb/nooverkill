name: 🐛 使用问题 · Bad case
description: 反馈使用 NoOverkill 提示词后仍然存在或新出现的问题。
title: "[Bad case] "
body:
  - type: markdown
    attributes:
      value: "请描述使用本仓库提示词后的具体问题，并说明提示词版本与加载方式。可以是仍然过度防御，也可以是漏掉必要检查、过度纠偏或与项目约定冲突。"
  - type: input
    id: environment
    attributes:
      label: Agent / 模型 / 版本 / 平台
      placeholder: "例如：Codex，模型名称，客户端版本，Linux"
    validations:
      required: true
  - type: dropdown
    id: family
    attributes:
      label: 问题类型
      options:
        - 无收益哈希 / 校验和
        - 项目不产生的边界情况
        - 重复审阅 / 机械评分
        - 过度搭建 / 包装 / 兼容层
        - 停滞 / 不必要提问
        - 交付文案 / 过程痕迹
        - 过度纠偏 / 漏掉必要校验或真实问题
        - 提示词与项目约定冲突
        - 提示词安装 / 加载问题
        - 其他具体问题
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: 原始任务与项目约束
      description: 说明用户实际要求、受支持用法，以及相关安全或兼容约定。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 使用提示词后的实际行为与证据
      description: 粘贴必要片段、代码、文档引用或公开链接。不要提交完整私有日志。
    validations:
      required: true
  - type: textarea
    id: consequence
    attributes:
      label: 对任务的影响，以及你期望的行为
      description: 说明仍未解决或新出现的问题。若有使用前后的对照，也欢迎提供。
    validations:
      required: true
  - type: textarea
    id: rules
    attributes:
      label: 使用的本仓库提示词与加载方式
      description: README 快速上手版 / full / core / 自定义；版本、提交号或使用日期；规则文件路径或直接粘贴。说明是否确认加载，不清楚可如实填写。
    validations:
      required: true
  - type: checkboxes
    id: disclosure
    attributes:
      label: 公开提交
      options:
        - label: 我已去除密钥和不应公开的个人或项目内容。
          required: true
