<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc"><title id="title">NoOverkill</title><desc id="desc">Less overengineering. More working code. Portable rules and open cases.</desc><rect width="1280" height="400" rx="10" fill="#f5f3ee"/><path d="M0 345H1280" stroke="#e2dcd0"/><g transform="translate(65 49)"><rect width="32" height="32" rx="8" fill="#da7756"/><path d="M8 14v-6h6m4 0h6v6m0 4v6h-6m-4 0h-6v-6m4-2 3 4 6-9" fill="none" stroke="#fffefa" stroke-width="1.7" stroke-linecap="round"/><text x="46" y="23" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#3f372d">NoOverkill</text><text x="0" y="123" font-family="Georgia,serif" font-size="49" fill="#28231c">Less overengineering.</text><text x="0" y="190" font-family="Georgia,serif" font-size="49" fill="#a54f34">More working code.</text><text x="2" y="244" font-family="Arial,sans-serif" font-size="15" fill="#827563">AI coding rules, skills and plugins. Six supported agents.</text></g><g transform="translate(837 65) rotate(3 160 135)"><rect width="345" height="250" rx="3" fill="#fffefa" stroke="#dfd5c5"/><text x="24" y="34" font-family="monospace" font-size="10" letter-spacing="2" fill="#a38b6d">FIELD NOTE / 001</text><g fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="147" y="72" width="165" height="110" rx="3" stroke="#9e9483"/><path d="M33 158H125L181 111H275" stroke="#da7756" stroke-width="3"/><path d="M125 158V211H228M181 111V52H248" stroke="#c7beae" stroke-width="1.4" stroke-dasharray="4 5"/><circle cx="33" cy="158" r="7" fill="#fffefa" stroke="#da7756" stroke-width="2"/><circle cx="125" cy="158" r="5" fill="#da7756" stroke="#da7756"/><circle cx="275" cy="111" r="14" fill="#f0f3e6" stroke="#83916a"/><path d="m268 111 5 5 9-10" stroke="#738253" stroke-width="2"/></g><text x="170" y="161" font-family="monospace" font-size="9" letter-spacing="2" fill="#9a8c76">WITHIN SCOPE</text><text x="24" y="232